<svg xmlns="http://www.w3.org/2000/svg" width="1298" height="468" viewBox="0 0 1298 468" role="img" aria-labelledby="t d">
<title id="t">Your coding agent, the Drex skills, and Drex</title>
<desc id="d">Three columns, left to right. Your coding agent keeps its own model for chat, reasoning and code: Claude Code, OpenCode, Hermes Agent, Codex, Cursor, Gemini CLI, GitHub Copilot, Windsurf, Cline, OpenClaw, Pi, DeepSeek Harness and other harnesses. It loads the Drex skills when they are relevant: drex-for-harness designs and calls Drex decisions, drexify scans a repository for decision sites and moves them to Drex. Two scripts come with them: a helper that checks your key and sends requests to hosted Drex, and a scanner that runs locally with no model or network. The skills send typed questions to Drex, which answers noul (yes or no), choice (one pick from a fixed set) and score (a level on an ordered scale), each with calibrated probabilities. Drex is hosted at drex.nace.ai with DREX_API_KEY, or self-hosted on your own server with no key.</desc>
